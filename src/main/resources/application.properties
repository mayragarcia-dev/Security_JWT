spring.application.name=demo_Security_JWT

# Configurar la base security_db y credenciales en el entorno antes de ejecutar.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/security_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Use una clave aleatoria de al menos 32 bytes en despliegues reales.
jwt.secret=${JWT_SECRET:local-demo-key-change-me-please-32-bytes-minimum}
jwt.expiration=${JWT_EXPIRATION:3600000}
